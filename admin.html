<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — Yousf Dent</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A2A66">
<link rel="icon" href="img/ui/favicon.png">
<link rel="preload" href="fonts/jakarta.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="css/app.css">
<style>
body{padding-bottom:30px}
.login{max-width:360px;margin:12vh auto 0;padding:0 20px;text-align:center}
.login .mark{width:76px;height:76px;border-radius:24px;background:#fff;display:grid;place-items:center;margin:0 auto 16px;box-shadow:var(--shadow2)}
.login .mark img{width:56px}
.login input{width:100%;height:56px;border-radius:16px;border:2px solid var(--line);text-align:center;font-size:24px;letter-spacing:.4em;margin:18px 0 12px;outline:0}
.login input:focus{border-color:var(--blue)}
.err{color:var(--red);font-size:13px;min-height:18px;margin:0 0 6px}
.tabs{display:flex;gap:6px;background:#fff;border-radius:16px;padding:5px;margin:0 16px 14px;box-shadow:var(--shadow);position:sticky;top:64px;z-index:15}
.tabs button{flex:1;height:40px;border-radius:12px;font-weight:800;font-size:13.5px;color:var(--muted)}
.tabs button.on{background:var(--night);color:#fff}
.filters{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.filters button{flex:none;height:34px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:var(--shadow);font-weight:700;font-size:12.5px}
.filters button.on{background:var(--blue);color:#fff}
.order .items{font-size:13px;margin:8px 0;padding:8px 10px;background:#F6F8FC;border-radius:12px}
.order .items div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.order select{height:38px;border-radius:12px;border:2px solid var(--line);font-weight:700;padding:0 8px;background:#fff;flex:1}
.order .acts{display:flex;gap:8px;align-items:center;margin-top:10px}
.prod{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:16px;padding:10px;box-shadow:var(--shadow);margin-bottom:10px}
.prod img{width:56px;height:56px;border-radius:12px;object-fit:contain;background:#F6F8FC;flex:none}
.prod .mid{flex:1;min-width:0}
.prod b{font-size:13.5px;display:block;line-height:1.3}
.prod .opts{display:grid;gap:6px;margin-top:8px}
.prod .o{display:flex;gap:6px}
.prod input{height:38px;border:2px solid var(--line);border-radius:10px;padding:0 10px;font-size:15px;min-width:0;outline:0}
.prod input:focus{border-color:var(--blue)}
.prod input.l{flex:1.4}.prod input.p{flex:1;max-width:110px}
.switch{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;margin-top:8px}
.switch input{appearance:none;width:44px;height:26px;border-radius:99px;background:#F3C7C9;position:relative;cursor:pointer;transition:.2s;border:0;padding:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked{background:var(--green)}.switch input:checked::after{left:21px}
.save{margin-top:8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.kpi{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.kpi small{color:var(--muted);font-weight:700;font-size:12px}
.kpi b{display:block;font-size:20px;color:var(--night);margin-top:4px}
.bars{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow);margin:12px 16px 0}
.bars h3{font-size:15px;margin-bottom:10px}
.bar{margin:8px 0;font-size:12.5px}
.bar div{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.bar i{display:block;height:8px;border-radius:9px;background:linear-gradient(90deg,var(--blue),var(--green))}
.search{margin:0 16px 12px;height:44px;width:calc(100% - 32px);border-radius:14px;border:2px solid var(--line);padding:0 14px;font-size:15px;outline:0}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" role="status" hidden></div>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
