<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Affiches — Yousf Dent</title>
<!-- Formats : ?f=a4 (A4) · ?f=sticker (10×10 cm) · ?f=story (1080×1920) · ?f=og (1200×630).
     Le QR code pointe vers l'adresse du site où cette page est ouverte (ou CFG.site en local).
     Imprimer : ouvrir la page puis Ctrl+P (marges : aucune, graphiques d'arrière-plan : activés). -->
<style>
@font-face{font-family:J;src:url(../fonts/jakarta.woff) format("woff");font-weight:200 800}
@font-face{font-family:Ar;src:url(../fonts/cairo-ar.woff) format("woff");font-weight:200 900}
:root{--night:#0A2A66;--blue:#1557D6;--green:#16B88A;--sky:#4EBBD6}
*{box-sizing:border-box;margin:0}
html,body{background:#0b1430}
body{font-family:J,system-ui,sans-serif;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{position:relative;overflow:hidden;background:
  radial-gradient(900px 600px at 110% -10%,rgba(21,87,214,.55),transparent 60%),
  radial-gradient(700px 500px at -20% 110%,rgba(22,184,138,.28),transparent 60%),
  linear-gradient(160deg,#0A2A66 0%,#071D4A 55%,#051537 100%)}
.page::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:18px 18px;pointer-events:none}
.page>*{position:relative}
.brand{display:flex;align-items:center;gap:12px}
.brand .m{background:#fff;border-radius:16px;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.brand b{font-weight:800;letter-spacing:.06em;display:block}
.brand small{color:#A9C3F0;font-weight:600;letter-spacing:.04em}
h1{font-weight:800;line-height:1.02;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--green)}
.ar{font-family:Ar,sans-serif;font-weight:700;direction:rtl;color:#CFE0FF}
.tiles{display:grid;grid-template-columns:repeat(3,1fr)}
.tile{background:#fff;border-radius:20px;aspect-ratio:1;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.28)}
.tile img{width:84%;height:84%;object-fit:contain}
.qrwrap{background:var(--green);border-radius:28px;position:relative;box-shadow:0 18px 50px rgba(22,184,138,.35)}
.qrwrap .lbl{position:absolute;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;font-weight:800;letter-spacing:.14em;border-radius:999px;white-space:nowrap;border:4px solid #fff}
.qrin{background:#fff;border-radius:20px;display:grid;place-items:center}
.qrin svg{display:block;width:100%;height:auto}
.cats{display:flex;flex-wrap:wrap}
.cats span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:999px;font-weight:600;color:#E3ECFF}
.steps{display:grid;grid-template-columns:repeat(3,1fr)}
.step{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:18px}
.step i{font-style:normal;display:grid;place-items:center;border-radius:50%;background:var(--green);font-weight:800;color:#fff}
.step b{display:block;font-weight:800}
.step span{color:#B9CBEE}
.foot{display:flex;align-items:center;justify-content:space-between;background:#fff;color:var(--night)}
.foot .url{font-weight:800;letter-spacing:-.01em}
.foot .url small{display:block;font-size:.5em;color:#5B6B88;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.foot .addr{text-align:right;font-weight:600;color:#33415E;line-height:1.35}

/* ---------- A4 : 210×297 mm ---------- */
.a4{width:210mm;height:297mm;padding:14mm 13mm 0}
.a4 .brand .m{width:58px;height:58px}.a4 .brand .m img{width:44px}
.a4 .brand b{font-size:24px}.a4 .brand small{font-size:12px}
.a4 h1{font-size:48px;margin-top:26px}
.a4 .ar{font-size:24px;margin-top:10px}
.a4 .mid{display:grid;grid-template-columns:1fr 268px;gap:22px;margin-top:34px;align-items:center}
.a4 .tiles{gap:12px}
.a4 .qrwrap{padding:30px 14px 14px}.a4 .qrwrap .lbl{top:-18px;font-size:15px;padding:6px 16px}
.a4 .qrin{padding:12px}
.a4 .qrcap{text-align:center;font-size:12.5px;font-weight:700;color:#fff;margin-top:10px}
.a4 .lab{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--sky);margin:30px 0 12px}
.a4 .cats{gap:7px}.a4 .cats span{font-size:12px;padding:5px 11px}
.a4 .steps{gap:10px}.a4 .step{padding:12px}.a4 .step i{width:30px;height:30px;font-size:15px;margin-bottom:8px}
.a4 .step b{font-size:14.5px}.a4 .step span{font-size:11.5px}
.a4 .foot{position:absolute;left:0;right:0;bottom:0;padding:16px 13mm}
.a4 .foot .url{font-size:25px}.a4 .foot .addr{font-size:12px}

/* ---------- Sticker : 100×100 mm ---------- */
.sticker{width:100mm;height:100mm;border-radius:0;padding:6mm;display:flex;flex-direction:column;align-items:center;text-align:center}
.sticker .brand{gap:8px}.sticker .brand .m{width:32px;height:32px;border-radius:10px}.sticker .brand .m img{width:24px}
.sticker .brand b{font-size:15px}
.sticker h1{font-size:16px;margin-top:5px;line-height:1.1}
.sticker .qrwrap{width:50mm;padding:16px 7px 7px;margin-top:20px;border-radius:18px}
.sticker .qrwrap .lbl{top:-13px;font-size:10.5px;padding:3px 10px;border-width:3px}
.sticker .qrin{padding:6px;border-radius:12px}
.sticker .url{margin-top:auto;font-weight:800;font-size:12.5px}
.sticker .url small{display:block;font-weight:600;font-size:9px;color:#A9C3F0}

/* ---------- Story : 1080×1920 ---------- */
.story{width:1080px;height:1920px;padding:110px 80px 0;text-align:center}
.story .brand{justify-content:center;gap:20px}.story .brand .m{width:110px;height:110px;border-radius:30px}.story .brand .m img{width:84px}
.story .brand b{font-size:48px;text-align:left}.story .brand small{font-size:22px}
.story h1{font-size:88px;margin-top:56px}
.story .ar{font-size:52px;margin-top:26px}
.story .tiles{gap:24px;margin-top:60px;padding:0 40px}.story .tile{border-radius:32px}
.story .qrwrap{width:520px;margin:96px auto 0;padding:56px 26px 26px;border-radius:44px}
.story .qrwrap .lbl{top:-34px;font-size:32px;padding:10px 32px;border-width:6px}
.story .qrin{padding:22px;border-radius:30px}
.story .qrcap{font-size:30px;font-weight:700;margin-top:22px}
.story .foot{position:absolute;left:0;right:0;bottom:0;padding:44px 80px;flex-direction:column;gap:10px}
.story .foot .url{font-size:52px}.story .foot .addr{text-align:center;font-size:26px}

/* ---------- OG : 1200×630 ---------- */
.og{width:1200px;height:630px;padding:56px 60px;display:grid;grid-template-columns:1fr 360px;gap:40px;align-items:center}
.og .brand .m{width:72px;height:72px;border-radius:20px}.og .brand .m img{width:54px}
.og .brand b{font-size:32px}.og .brand small{font-size:16px}
.og h1{font-size:62px;margin-top:30px}
.og p.sub{font-size:22px;color:#B9CBEE;margin-top:18px;font-weight:600}
.og .tiles{gap:14px}.og .tile{border-radius:22px}
.og .wa{display:inline-flex;gap:10px;align-items:center;margin-top:26px;background:var(--green);border-radius:999px;padding:12px 22px;font-weight:800;font-size:20px}

@page{margin:0}
@media print{html,body{background:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="../js/config.js"></script>
<script src="qrcode.js"></script>
<script>
(async () => {
  const C = window.CFG;
  const f = new URLSearchParams(location.search).get('f') || 'a4';
  const isLocal = /^(localhost|127\.|0\.0\.0\.0|\[::1\])/.test(location.hostname) || location.protocol === 'file:';
  const url = (new URLSearchParams(location.search).get('url') || (isLocal ? C.site : location.origin)).replace(/\/$/, '') + '/';
  const short = url.replace(/^https?:\/\//, '').replace(/\/$/, '');
  const data = await (await fetch('../data/products.json')).json();
  const IMG = ['scialytique-led', 'turbine-skyma', 'coffret-dmp', 'alginate-kromopan', 'desinfectant-surfaces-prosept-spray', 'limes-k-h-broches-mani'];
  const tiles3 = IMG.slice(0, 3).map(id => `<div class="tile"><img src="../img/p/${id}.webp" alt=""></div>`).join('');
  const tiles = IMG.map(id => `<div class="tile"><img src="../img/p/${id}.webp" alt=""></div>`).join('');

  function qrSVG(text) {
    const q = qrcode(0, 'H'); q.addData(text); q.make();
    const n = q.getModuleCount(), m = 4, S = n + m * 2; let d = '';
    const logo = Math.round(n * 0.22) | 1, l0 = (n - logo) / 2;   // zone centrale réservée au logo (~5% des modules, ECC H tolère 30%)
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (!q.isDark(r, c)) continue;
      const finder = (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
      if (finder) continue;
      if (r >= l0 - .5 && r < l0 + logo && c >= l0 - .5 && c < l0 + logo) continue;
      d += `M${c + m} ${r + m}h1v1h-1z`;
    }
    const eye = (x, y) => `<rect x="${x + m + .5}" y="${y + m + .5}" width="6" height="6" fill="none" stroke="#0A2A66" stroke-width="1"/><rect x="${x + m + 2}" y="${y + m + 2}" width="3" height="3" fill="#0A2A66"/>`;
    const lc = m + l0 - .2, ls = logo + .4;
    return `<svg viewBox="0 0 ${S} ${S}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="${S}" height="${S}" fill="#fff"/><path d="${d}" fill="#0A2A66"/>${eye(0, 0)}${eye(n - 7, 0)}${eye(0, n - 7)}
      <rect x="${lc}" y="${lc}" width="${ls}" height="${ls}" rx="1.4" fill="#fff"/><image href="../img/ui/logo.png" x="${lc + ls * .1}" y="${lc + ls * .16}" width="${ls * .8}" height="${ls * .68}" preserveAspectRatio="xMidYMid meet"/></svg>`;
  }
  const brand = `<div class="brand"><span class="m"><img src="../img/ui/logo.png" alt=""></span><div><b>YOUSF DENT</b><small>CONSOMMABLES ET MATÉRIEL DENTAIRES</small></div></div>`;
  const qr = cap => `<div class="qrwrap"><span class="lbl">SCANNEZ-MOI</span><div class="qrin">${qrSVG(url)}</div>${cap ? `<p class="qrcap">${cap}</p>` : ''}</div>`;
  const title = 'Tout votre cabinet,<br><em>en un seul scan.</em>';
  const ar = '<p class="ar">كل ما تحتاجه عيادتك في مسح واحد</p>';
  const steps = `<div class="steps"><div class="step"><i>1</i><b>Scannez</b><span>le QR code avec votre téléphone</span></div><div class="step"><i>2</i><b>Choisissez</b><span>vos produits dans le catalogue</span></div><div class="step"><i>3</i><b>Commandez</b><span>et envoyez sur WhatsApp</span></div></div>`;
  const foot = `<div class="foot"><div class="url"><small>Catalogue en ligne</small>${short}</div><div class="addr">${C.address}<br>Tél. ${C.phone}</div></div>`;
  const pages = {
    a4: `<div class="page a4">${brand}<h1>${title}</h1>${ar}<div class="mid"><div class="tiles">${tiles}</div>${qr(`${data.products.length}+ produits · commande WhatsApp`)}</div>
      <p class="lab">Nos catégories</p><div class="cats">${data.cats.map(c => `<span>${c.name}</span>`).join('')}</div>
      <p class="lab">Comment commander</p>${steps}${foot}</div>`,
    sticker: `<div class="page sticker">${brand.replace('<small>CONSOMMABLES ET MATÉRIEL DENTAIRES</small>', '')}<h1>Tout votre cabinet,<br><em>en un seul scan.</em></h1>${qr('')}<p class="url">${short}<small>${C.phone}</small></p></div>`,
    story: `<div class="page story">${brand}<h1>${title}</h1>${ar}<div class="tiles">${tiles3}</div>${qr('Scannez · Choisissez · Commandez sur WhatsApp')}${foot}</div>`,
    og: `<div class="page og"><div>${brand}<h1>${title}</h1><p class="sub">${data.products.length}+ produits dentaires · Salé</p><span class="wa">Commande rapide sur WhatsApp</span></div><div class="tiles" style="grid-template-columns:repeat(2,1fr)">${tiles}</div></div>`
  };
  document.getElementById('root').innerHTML = pages[f] || pages.a4;
  document.title = 'Affiche ' + f + ' — Yousf Dent';
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  await document.fonts.ready;
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
